<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubhlo - Coming Soon Teaser</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

body {
margin: 0;
padding: 0;
background: #0b0713;
color: #ffffff;
font-family: 'Outfit', sans-serif;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
position: relative;
}

/* Ambient Glowing Backgrounds */
.glow-circle {
position: absolute;
width: 500px;
height: 500px;
border-radius: 50%;
background: radial-gradient(circle, rgba(142, 68, 173, 0.25) 0%, transparent 70%);
filter: blur(50px);
z-index: 1;
animation: floatGlow 10s ease-in-out infinite alternate;
}

.glow-circle-right {
position: absolute;
right: -100px;
bottom: -100px;
width: 600px;
height: 600px;
border-radius: 50%;
background: radial-gradient(circle, rgba(232, 67, 147, 0.2) 0%, transparent 70%);
filter: blur(60px);
z-index: 1;
animation: floatGlow 12s ease-in-out infinite alternate-reverse;
}

@keyframes floatGlow {
0% { transform: translate(-30px, -30px) scale(1); }
100% { transform: translate(30px, 30px) scale(1.1); }
}

/* Floating Particles */
.particles {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 2;
pointer-events: none;
}

.particle {
position: absolute;
background: rgba(255, 215, 0, 0.4);
border-radius: 50%;
animation: floatUp 8s infinite linear;
}

@keyframes floatUp {
0% {
transform: translateY(100vh) scale(0);
opacity: 0;
}
50% {
opacity: 0.8;
}
100% {
transform: translateY(-10vh) scale(1);
opacity: 0;
}
}

/* Main Container */
.teaser-container {
position: relative;
z-index: 10;
text-align: center;
max-width: 800px;
padding: 20px;
}

.logo-badge {
display: inline-flex;
align-items: center;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
padding: 8px 20px;
border-radius: 30px;
font-size: 14px;
font-weight: 600;
letter-spacing: 2px;
color: #FFD700;
margin-bottom: 25px;
box-shadow: 0 4px 15px rgba(255, 215, 0, 0.08);
animation: zoomIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

h1.brand-title {
font-size: 80px;
font-weight: 800;
margin: 0 0 10px 0;
letter-spacing: -2px;
background: linear-gradient(135deg, #ffffff 30%, #f1d5ff 70%, #d88aff 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 10px 30px rgba(142, 68, 173, 0.2);
animation: fadeInUp 1.2s ease-out;
}

.slogan {
font-size: 22px;
color: rgba(255, 255, 255, 0.8);
margin-bottom: 45px;
font-weight: 300;
letter-spacing: 0.5px;
animation: fadeInUp 1.4s ease-out;
}

/* Cinematic Coming Soon Badge */
.coming-soon-box {
display: inline-block;
position: relative;
background: linear-gradient(90deg, #8e44ad, #e84393);
padding: 18px 45px;
border-radius: 16px;
font-size: 32px;
font-weight: 800;
letter-spacing: 4px;
box-shadow: 0 10px 35px rgba(232, 67, 147, 0.45);
animation: pulseGlow 2.5s infinite alternate;
}

@keyframes pulseGlow {
0% {
transform: scale(1);
box-shadow: 0 10px 35px rgba(232, 67, 147, 0.4);
}
100% {
transform: scale(1.04);
box-shadow: 0 15px 45px rgba(142, 68, 173, 0.6), 0 0 20px rgba(232, 67, 147, 0.4);
}
}

/* Countdown Timer */
.countdown {
display: flex;
justify-content: center;
gap: 25px;
margin-top: 50px;
animation: fadeInUp 1.8s ease-out;
}

.time-block {
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 12px;
padding: 15px;
min-width: 90px;
backdrop-filter: blur(10px);
}

.time-num {
font-size: 36px;
font-weight: 800;
color: #FFD700;
margin: 0;
}

.time-label {
font-size: 11px;
text-transform: uppercase;
letter-spacing: 1px;
color: rgba(255, 255, 255, 0.5);
margin-top: 5px;
}

@keyframes fadeInUp {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes zoomIn {
from { opacity: 0; transform: scale(0.8); }
to { opacity: 1; transform: scale(1); }
}
</style>
</head>
