name: Flask CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping unit tests."
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Check Deployment Configuration
        if: env.SERVER_HOST == ''
        run: |
          echo "Hostinger SSH secrets (SERVER_HOST) not configured in GitHub repository secrets."
          echo "Skipping automated SSH push."

      - name: Deploy to Hostinger VPS via SSH
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/Shubhlo
            git pull
            /var/www/Shubhlo/venv/bin/pip install --upgrade pip
            if [ -f requirements.txt ]; then
              /var/www/Shubhlo/venv/bin/pip install -r requirements.txt
            fi
            sudo systemctl restart shubhlo
